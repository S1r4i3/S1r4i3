name: Generate Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"

  # Allows manual execution
  workflow_dispatch:

  # Run whenever main is updated
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: S1r4i3

          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.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 }}
